{% extends "base.html" %}
{% block title %}Anmelden · AP YAML Hub{% endblock %}
{% block content %}
<div class="panel" style="max-width:420px;margin:40px auto">
  <h1>Anmelden</h1>
  <p class="muted">Einfach deinen Namen eingeben. Gibt es ihn noch nicht, wird er angelegt.</p>
  <form method="post" class="stack">
  <input type="hidden" name="_csrf" value="{{ csrf_token }}">
    <div><label>Name<br><input name="username" required maxlength="32" autofocus style="width:100%"></label></div>
    {% if needs_password %}
    <div><label>Gruppen-Passwort<br><input name="password" type="password" required style="width:100%"></label></div>
    {% endif %}
    <button class="primary">Weiter</button>
  </form>
</div>
{% endblock %}
