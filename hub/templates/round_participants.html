<ul class="round-participants small{% if compact and participants|length > 4 %} round-participants-compact{% endif %}"{% if compact and participants|length > 4 %} tabindex="0" aria-label="{{ _('Mitspieler') }}"{% endif %}>
{% for player in participants %}<li><span><strong>{{ player.name }}</strong><span class="muted"> · {{ player.game or _('Noch kein Spiel ausgewählt') }}</span></span>{% if show_readiness %}<span class="chip {{ 'ok' if player.ready else 'warn' }}">{{ _('Bereit') if player.ready else _('Nicht bereit') }}</span>{% endif %}</li>{% endfor %}
</ul>
