name: Python and browser tests

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            group: all
            pattern: "test*.py"
          - os: windows-latest
            group: a-g
            pattern: "test_[a-g]*.py"
          - os: windows-latest
            group: h-p
            pattern: "test_[h-p]*.py"
          - os: windows-latest
            group: rest
            pattern: "test_[!a-p]*.py"
    name: unit-tests (${{ matrix.os }}, ${{ matrix.group }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -p "${{ matrix.pattern }}" -v

  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-browser.txt
      - name: Install browser test dependencies
        run: python -m pip install -r requirements-browser.txt
      - name: Install Chromium and system dependencies
        run: python -m playwright install --with-deps chromium
      - name: Run isolated Playwright tests
        run: python -m browser_tests
      - name: Upload browser reports, logs and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: warn
